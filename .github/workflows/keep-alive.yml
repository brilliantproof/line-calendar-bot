name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping server
        run: |
          curl -s --max-time 30 --retry 2 --retry-delay 5 \
            https://line-calendar-bot-2cdl.onrender.com/health \
            && echo "OK" || echo "Server not responding (may be restarting)"
